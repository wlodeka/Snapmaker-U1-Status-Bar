[platformio]
default_envs = u1_status_bar

[env:u1_status_bar]
platform = espressif32@6.12.0
board = waveshare_esp32_s3_zero
framework = arduino
board_build.partitions = partitions.csv
extra_scripts =
    pre:scripts/panel_page.py
    post:scripts/ota_upload.py

monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool
upload_port = COMxx
monitor_port = COMxx

build_flags =
    -D U1_LED_GPIO=4
; Host-only tests (stubbed Arduino/NVS); run them with: pio test -e native
test_ignore = test_native

lib_deps =
    adafruit/Adafruit NeoPixel@1.12.5
    links2004/WebSockets@2.7.2
    bblanchon/ArduinoJson@6.21.5

; Host unit tests: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -I test/stubs
build_src_filter = +<settings.cpp>
test_build_src = yes
lib_deps =
    bblanchon/ArduinoJson@6.21.5
